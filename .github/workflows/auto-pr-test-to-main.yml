name: Actualizar Pull Request de test a main

on:
  pull_request:
    types: [closed]
    branches:
      - test

# Evita que dos merges seguidos editen el PR al mismo tiempo
concurrency:
  group: auto-pr-test-to-main
  cancel-in-progress: false

jobs:
  pr-test-to-main:
    # Solo cuando el PR se mergeó (no cuando se cerró sin merge)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Crear o actualizar el PR de test a main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const { owner, repo } = context.repo;
            const merged = context.payload.pull_request;

            // Si viene del PR automático develop → test, su cuerpo ya lista
            // los PRs originales; en otro caso se arma la entrada con este PR.
            const entry = merged.head.ref === 'develop' && merged.body
              ? merged.body.trim()
              : [
                  `### #${merged.number} ${merged.title}`,
                  `Por @${merged.user.login}`,
                  '',
                  (merged.body || '_Sin descripción._').trim(),
                ].join('\n');

            const { data: open } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:test`, base: 'main',
            });

            if (open.length === 0) {
              const body = [
                'PR generado automáticamente. Reúne los cambios que ya pasaron por `test`.',
                'Se queda abierto hasta que se mergee manualmente.',
                '',
                '## Cambios incluidos',
                '',
                entry,
              ].join('\n');

              const { data: pr } = await github.rest.pulls.create({
                owner, repo, head: 'test', base: 'main',
                title: 'Auto PR: test → main', body,
              });
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: ['auto-pr'],
              });
              return;
            }

            const pr = open[0];
            const current = pr.body || '';

            // Idempotencia: no se repiten entradas ya listadas
            const firstLine = entry.split('\n')[0];
            if (current.includes(firstLine)) return;

            await github.rest.pulls.update({
              owner, repo, pull_number: pr.number,
              body: `${current}\n\n${entry}`,
            });
